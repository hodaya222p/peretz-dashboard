<style>
/* Layout: quiet ivory workspace — slim top bar, project hero with photo collage, category rail, one working table. */
:root{

}

  --charcoal:#F5F1EA; --line:rgba(237,228,214,.10); --line2:rgba(237,228,214,.2); --tint:rgba(199,183,163,.10); --tint2:rgba(201,157,124,.14);
  --fg:#E7DED1; --muted:#A39888; --ok:#8DAE88; --warn:#D9A566; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.25); color-scheme:dark}}

.muted{color:var(--muted);font-size:13px}
.eyebrow{font-size:11.5px;font-weight:600;letter-spacing:.06em;color:var(--muted);display:block;margin-bottom:10px}

.h3{font-family:var(--f-display);font-weight:400;font-size:19px;color:var(--walnut);margin:0 0 10px}

.mrow{display:flex;gap:12px;align-items:center;padding:6px 0}.mrow.big{padding:10px 0;border-bottom:1px solid var(--line)}.mrow.past{opacity:.7}

.phlist{padding:12px 24px 26px;display:flex;flex-direction:column;gap:8px}

.bp{display:block;width:100%;aspect-ratio:3/2;background:#2F4155;stroke:#C9D7E6;stroke-width:.6;fill:none}

.pl-b{padding:14px;display:flex;flex-direction:column;gap:4px}.pl-b h4{margin:2px 0 0;color:var(--walnut);font-size:16px}
.pl-top{display:flex;justify-content:space-between;align-items:center}.code{font-family:var(--f-latin);font-size:12px;letter-spacing:.1em;color:var(--bronze)}
.pl-n{display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--warn);margin-top:4px}
.nflow{display:flex;align-items:center;gap:10px;padding:16px 24px 10px;flex-wrap:wrap}.nflow i{width:28px;height:1px;background:var(--line2)}.nflow b{margin-inline-start:auto;color:var(--walnut);font-size:14px}

.cell.bord,.noteform .cell{border-color:var(--line2);background:var(--raise)}
.timeline{padding:20px 24px 26px;display:flex;flex-direction:column;gap:16px}
.vcard{display:grid;grid-template-columns:64px minmax(0,1fr);gap:16px}
.vdate{display:flex;flex-direction:column;align-items:center;padding-top:4px}.vdate b{font-family:var(--f-display);font-size:30px;color:var(--walnut);line-height:1}.vdate span{font-size:12px;color:var(--muted)}
.vbody{border:1px solid var(--line);border-radius:var(--r);padding:18px;background:var(--raise)}.vbody h4{margin:0;color:var(--walnut);font-size:17px}

.next{display:flex;gap:8px;align-items:center;color:var(--bronze);font-size:13.5px;margin:12px 0 0}

table.qc{min-width:760px}table.qc td small{display:block;font-size:11.5px;color:var(--muted);font-weight:400}

table.qc td,table.qc th{text-align:center}table.qc td:first-child,table.qc th:first-child{text-align:right}
.days{padding:20px 24px 26px;display:flex;flex-direction:column;gap:12px}

function refresh(){

 set('k-after',money(t.after));set('k-vat',money(t.vat));set('k-total',money(t.total));
 set('k-count',cntHtml(p));
 const max=Math.max(...Object.values(t.byCat),1);

 set('f-sub',money(t.sub));set('f-disc',t.discAmt?'−'+money(t.discAmt):'—');set('f-vat',money(t.vat));set('f-total',money(t.total));
 if(S.cat!=='summary'){const items=p.items.filter(i=>i.cat===S.cat);set('cat-sub',money(shown(items.reduce((a,i)=>a+line(i),0))));
  items.forEach(i=>set('row-'+i.id,i.price?money(shown(line(i))):'<span class="pending">ממתין למחיר</span>'));

function bindCount(){
 if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
 app.querySelectorAll('[data-count]').forEach(el=>{const to=+el.dataset.count;const t0=performance.now();
  const step=n=>{const k=Math.min((n-t0)/900,1);const e=1-Math.pow(1-k,3);el.textContent=money(to*e);if(k<1)requestAnimationFrame(step)};requestAnimationFrame(step)});
}

/* ---------- modal shell ---------- */
function modal(title,ic,steps,step,body,foot=''){
 closeModal();const s=document.createElement('div');s.className='scrim';s.id='scrim';
 s.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-label="${title}"><div class="mhead"><span class="ic" style="width:40px;height:40px;border-radius:11px;background:var(--tint);color:var(--bronze);display:grid;place-items:center">${svg(ic).replace('<svg','<svg width="22" height="22"')}</span><h3>${title}</h3><div class="steps">${steps.map((t,k)=>`<span class="${k===step?'on':''}">${t}</span>`).join('')}</div><button class="x" data-close aria-label="סגירה">×</button></div><div class="mbody">${body}</div>${foot?`<div class="mfoot">${foot}</div>`:''}</div>`;
 s.addEventListener('click',e=>{if(e.target===s||e.target.closest('[data-close]'))closeModal()});document.body.append(s);return s;
}
function closeModal(){document.getElementById('scrim')?.remove()}
function dropzone(s,title,text,accept,onGo){
 const z=s.querySelector('.drop');const inp=s.querySelector('#dz');
 ['dragenter','dragover'].forEach(ev=>z.addEventListener(ev,e=>{e.preventDefault();z.classList.add('over')}));
 ['dragleave','drop'].forEach(ev=>z.addEventListener(ev,e=>{e.preventDefault();z.classList.remove('over')}));
 z.addEventListener('drop',e=>{if(e.dataTransfer.files[0])onGo(e.dataTransfer.files[0].name)});
 inp.addEventListener('change',()=>inp.files[0]&&onGo(inp.files[0].name));
 s.querySelector('[data-sample]').addEventListener('click',()=>onGo(null));
}
function scanning(s,lines,done){
 const body=s.querySelector('.mbody');body.innerHTML=`<div class="progress"><i id="pg"></i></div><div class="scan">${lines.map(l=>`<div class="line"><span class="dot"></span>${l}</div>`).join('')}</div>`;
 const els=[...body.querySelectorAll('.line')];let k=0;
 const tick=()=>{els.forEach((e,j)=>{e.className='line'+(j<k?' done':j===k?' run':'');e.querySelector('.dot').textContent=j<k?'✓':''});body.querySelector('#pg').style.width=k/els.length*100+'%';if(k++<els.length)setTimeout(tick,650);else setTimeout(done,350)};tick();
}

 sc.add(new T.Mesh(new T.PlaneGeometry(2,2),new T.ShaderMaterial({uniforms:U,depthTest:false,
  vertexShader:'varying vec2 v;void main(){v=uv;gl_Position=vec4(position.xy,0.,1.);}',
  fragmentShader:`precision highp float;varying vec2 v;uniform sampler2D tA,dA,tB,dB;uniform float pA,pB,mx,ar;uniform vec2 fA,fB,mouse;
  vec2 cov(vec2 uv){float ia=16./9.;vec2 s=ar>ia?vec2(1.,ia/ar):vec2(ar/ia,1.);return (uv-.5)*s/1.035+.5;}
  vec3 shot(sampler2D t,sampler2D d,float p,vec2 f,vec2 uv){vec2 q=uv;for(int i=0;i<6;i++){float z=texture2D(d,q).r;float s=1.+p*(.07+.40*z*z+.10*z);q=f+(uv-f)/s-mouse*(z-.35)*.014;}

function storyFrame(){
 const s=document.getElementById('story');if(!s)return;
 const st=s.querySelector('.st-stick'),r=s.getBoundingClientRect(),top=parseFloat(getComputedStyle(st).top)||0;
 const span=r.height-st.offsetHeight;if(span<=0)return;
 const P=Math.max(0,Math.min(1,(top-r.top)/span));
 const cl=x=>Math.max(0,Math.min(1,x)),E=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;
 const n=SHOTS.length,seg=.5/n,xf=.022;
 s.querySelectorAll('.st-img').forEach(el=>{const k=+el.dataset.k,a=k*seg,b=a+seg;
  const fin=k===0?1:cl((P-(a-xf))/xf),fout=k===n-1?1:1-cl((P-(b-xf))/xf);const o=Math.min(fin,fout);el.style.opacity=o;el.style.visibility=o>0?'visible':'hidden';
  const loc=cl((P-(a-xf))/(seg+xf)),exit=k===n-1?0:cl((P-(b-xf))/xf);
  el.style.transform=`scale(${(1.03+loc*.2+exit*exit*.55).toFixed(4)})`;el.style.filter=exit>0?`blur(${(exit*7).toFixed(1)}px) brightness(${(1+exit*.25).toFixed(2)})`:'none'});
 if(Dolly&&P<.58){const k=Math.min(n-1,Math.floor(P/seg)),pk=j=>cl((P-(j*seg-xf))/(seg+xf)),mx=k<n-1?cl((P-((k+1)*seg-xf))/xf):0;Dolly.set(k,pk(k)+mx*mx*.55,k<n-1?pk(k+1):0,mx)}
 s.querySelector('.st-shade').style.opacity=1-cl((P-.5)/.05);
 s.querySelector('.st-mist').style.opacity=cl((P-.49)/.06)*(1-cl((P-.6)/.05));
 const md=s.querySelector('.st-model');const mo=cl((P-.53)/.05)*(1-cl((P-.8)/.04));md.style.opacity=mo;md.style.visibility=mo>0?'visible':'hidden';
 const ex=E(cl((P-.6)/.12));const box=s.querySelector('.st-mbox');box.style.setProperty('--sh',st.offsetHeight+'px');
 box.style.transform=`translate(-50%,-50%) scale(${(1.08-cl((P-.53)/.27)*.08).toFixed(4)})`;
 s.querySelector('.m-b').style.opacity=ex;s.querySelector('.m-labels').style.setProperty('--on',cl((ex-.7)/.3));s.querySelector('.m-labels').style.pointerEvents=ex>.9&&mo>.9?'auto':'none';
 const dk=s.querySelector('.st-dark');dk.style.opacity=cl((P-.8)/.05);
 dk.querySelectorAll('b[data-to]').forEach(b=>{const v=Math.round(+b.dataset.to*E(cl((P-.84)/.1)));b.textContent=v+b.dataset.u});
 s.querySelectorAll('.st-text').forEach(el=>{const f=+el.dataset.from,t=+el.dataset.to;const inA=cl((P-f-.012)/.03),out=1-cl((P-(t-.035))/.025);el.style.opacity=f===0?Math.min(1,out):Math.min(inA,out);
  el.querySelectorAll('span').forEach((sp,i)=>{const d=cl((P-f-.012-i*.008)/.04);sp.style.transform=`translateY(${f===0?0:(1-d)*30}px)`})});
 s.querySelector('.st-hint').style.opacity=1-cl(P/.04);
}
